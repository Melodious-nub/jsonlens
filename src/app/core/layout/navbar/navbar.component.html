<header class="navbar" role="banner" appClickOutside (clickOutside)="closeMobileMenu()">
  <!-- Clean Professional Brand Mark -->
  <div class="navbar__brand">
    <a routerLink="/" (click)="closeMobileMenu()" class="brand-link focus-ring" aria-label="JsonLens Home">
      <span class="brand-name">
        <span class="brand-name__bracket">&#123;</span><span class="brand-name__json">Json</span><span class="brand-name__lens">Lens</span><span class="brand-name__bracket">&#125;</span>
      </span>
    </a>
  </div>

  <div class="navbar__spacer"></div>

  <!-- Navigation & Actions (Unified Desktop & Mobile) -->
  <div class="navbar__right">
    <!-- Desktop-only Site Navigation -->
    <nav class="navbar__nav navbar__nav--desktop" aria-label="Site Navigation">
      <a routerLink="/about" class="nav-item focus-ring" routerLinkActive="nav-item--active">About</a>
    </nav>

    <div class="navbar__divider navbar__divider--desktop" role="separator" aria-orientation="vertical"></div>

    <div class="navbar__actions">
      <!-- Centralized 5-Theme Selector Popover (Desktop & Mobile) -->
      <div class="theme-selector-wrapper" appClickOutside (clickOutside)="closeThemeMenu()">
        <button
          type="button"
          class="icon-btn focus-ring theme-palette-btn"
          [class.theme-palette-btn--active]="isThemeMenuOpen()"
          (click)="toggleThemeMenu()"
          aria-label="Select color theme"
          title="Choose Theme"
          [attr.aria-expanded]="isThemeMenuOpen()"
          aria-haspopup="dialog"
        >
          <lucide-icon [img]="paletteIcon" size="16" class="action-icon" />
          <span class="theme-active-dot" [style.background]="activeThemePrimaryColor()"></span>
        </button>

        @if (isThemeMenuOpen()) {
          <div class="theme-popover" role="dialog" aria-label="Theme options">
            <div class="theme-popover__header">
              <span class="theme-popover__title">Color Theme</span>
              <span class="theme-popover__count">5 Themes</span>
            </div>
            <div class="color-themes-list" role="radiogroup" aria-label="Available Themes">
              @for (item of themes; track item.id) {
                <button
                  type="button"
                  class="color-theme-card focus-ring"
                  [class.color-theme-card--active]="themeService.theme() === item.id"
                  (click)="onSelectTheme(item.id, $event)"
                  role="radio"
                  [attr.aria-checked]="themeService.theme() === item.id"
                >
                  <div class="color-theme-card__left">
                    <div class="swatch-dots" aria-hidden="true">
                      <span class="swatch-dot" [style.background]="item.swatch[0]"></span>
                      <span class="swatch-dot" [style.background]="item.swatch[1]"></span>
                      <span class="swatch-dot" [style.background]="item.swatch[2]"></span>
                    </div>
                    <span class="color-theme-card__name">{{ item.name }}</span>
                  </div>

                  @if (themeService.theme() === item.id) {
                    <lucide-icon [img]="checkIcon" size="13" class="color-theme-card__check" />
                  }
                </button>
              }
            </div>
          </div>
        }
      </div>

      <!-- GitHub Link (Desktop only) -->
      <a
        href="https://github.com/Melodious-nub/jsonlens"
        target="_blank"
        rel="noopener noreferrer"
        class="icon-btn focus-ring navbar__github-link--desktop"
        aria-label="View JsonLens source on GitHub"
        title="View source on GitHub"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="action-icon" aria-hidden="true">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z" />
        </svg>
      </a>

      <!-- Mobile Hamburger Toggle (< 768px) -->
      <button
        type="button"
        class="icon-btn focus-ring navbar__menu-toggle navbar__menu-toggle--mobile"
        [class.navbar__menu-toggle--active]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-nav-drawer"
      >
        <lucide-icon [img]="isMobileMenuOpen() ? closeIcon : menuIcon" size="18" />
      </button>
    </div>
  </div>

  <!-- Mobile Collapsible Menu Drawer -->
  @if (isMobileMenuOpen()) {
    <div class="navbar__mobile-backdrop" (click)="closeMobileMenu()" aria-hidden="true"></div>
    <nav id="mobile-nav-drawer" class="navbar__mobile-drawer" aria-label="Mobile Navigation">
      <div class="navbar__mobile-nav-list">
        <a
          routerLink="/"
          (click)="closeMobileMenu()"
          class="mobile-nav-item focus-ring"
          routerLinkActive="mobile-nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <lucide-icon [img]="codeIcon" size="16" class="mobile-item-icon" />
          <span class="mobile-item-label">Workspace</span>
        </a>

        <a
          routerLink="/about"
          (click)="closeMobileMenu()"
          class="mobile-nav-item focus-ring"
          routerLinkActive="mobile-nav-item--active"
        >
          <lucide-icon [img]="infoIcon" size="16" class="mobile-item-icon" />
          <span class="mobile-item-label">About & Creator</span>
        </a>

        <div class="mobile-nav-divider" role="separator"></div>

        <a
          href="https://github.com/Melodious-nub/jsonlens"
          target="_blank"
          rel="noopener noreferrer"
          (click)="closeMobileMenu()"
          class="mobile-nav-item mobile-nav-item--github focus-ring"
        >
          <div class="mobile-item-left">
            <svg viewBox="0 0 24 24" fill="currentColor" class="mobile-item-icon mobile-item-icon--svg" aria-hidden="true">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z" />
            </svg>
            <span class="mobile-item-label">GitHub Repository</span>
          </div>
          <lucide-icon [img]="externalIcon" size="14" class="mobile-external-icon" />
        </a>
      </div>
    </nav>
  }
</header>
