<div class="code-lens">
  <div class="code-lens__header">
    <div class="code-lens__meta">
      <lucide-icon [img]="fileCodeIcon" class="meta-icon" size="14" />
      <span class="meta-pill">{{ lineCount() }} lines</span>
      <span class="meta-pill">{{ engine.jsonStats().byteSize | fileSize }}</span>
      @if (engine.indentOption() === 'minified') {
        <span class="meta-pill meta-pill--highlight">Minified</span>
      } @else {
        <span class="meta-pill">{{ engine.indentOption() }}</span>
      }
    </div>

    <div class="code-lens__actions">
      <button
        type="button"
        class="action-btn"
        (click)="copyToClipboard()"
        title="Copy Formatted JSON"
        aria-label="Copy Formatted JSON"
      >
        <lucide-icon [img]="copyIcon" size="14" />
        <span>Copy JSON</span>
      </button>
    </div>
  </div>

  <div class="code-lens__editor-container">
    <app-monaco-editor
      [content]="formattedJson()"
      [readOnly]="true"
      language="json"
    />
  </div>
</div>
