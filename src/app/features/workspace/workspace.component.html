<section class="workspace" [class.workspace--fullscreen]="isFullscreen()">
  <!-- Split Screen Panels Area -->
  <div
    #panelsContainer
    class="workspace__panels"
    [class.is-resizing]="isDragging()"
    [class.workspace__panels--mobile-output]="mobilePane() === 'output'"
    appSwipeGesture
    (swipeLeft)="onSwipeLeft()"
    (swipeRight)="onSwipeRight()"
  >
    <!-- Left Pane: Input Editor & Drop Zone -->
    <div
      class="workspace__pane workspace__pane--input"
      [style.flex-basis.%]="splitPercent()"
      (pointerdown)="setActivePane('input')"
      (focusin)="setActivePane('input')"
      appDropZone
      (fileDropped)="onFileDropped($event)"
    >
      <div class="pane-header">
        <div class="pane-header__group">
          <button
            type="button"
            class="header-btn header-btn--primary focus-ring"
            (click)="onFormat()"
            title="Prettify and format JSON"
            aria-label="Format JSON"
          >
            <lucide-icon [img]="formatIcon" size="13" />
            <span>Format</span>
          </button>

          <button
            type="button"
            class="header-btn header-btn--default focus-ring"
            (click)="onMinify()"
            title="Compress to single-line minified JSON"
            aria-label="Minify JSON"
          >
            <lucide-icon [img]="minifyIcon" size="13" />
            <span>Minify</span>
          </button>

          <button
            type="button"
            class="header-btn focus-ring"
            [class.header-btn--repair-active]="!engine.isValid()"
            [class.header-btn--default]="engine.isValid()"
            (click)="onAutoRepair()"
            title="Auto-repair syntax errors (trailing commas, quotes, unclosed brackets)"
            aria-label="Auto-Fix JSON Syntax Errors"
          >
            <lucide-icon [img]="fixIcon" size="13" />
            <span>Auto-Fix</span>
          </button>
        </div>

        <div
          class="pane-header__badge"
          [class.pane-header__badge--valid]="engine.isValid()"
          [class.pane-header__badge--invalid]="!engine.isValid()"
          [title]="engine.isValid() ? 'Valid JSON' : (engine.jsonError()?.message || 'Syntax Error Detected')"
        >
          <span
            class="input-status-dot"
            [class.input-status-dot--valid]="engine.isValid()"
            [class.input-status-dot--invalid]="!engine.isValid()"
          ></span>
          <span class="input-status-label">{{ engine.isValid() ? 'Valid' : 'Invalid' }}</span>
        </div>
      </div>

      <div class="pane-content">
        <app-monaco-editor
          #inputEditor
          [content]="engine.rawInput()"
          (contentChange)="engine.setInput($event)"
          (formatRequested)="onFormat()"
          (minifyRequested)="onMinify()"
          (autoRepairRequested)="onAutoRepair()"
          [errorMarkers]="engine.jsonError() ? [engine.jsonError()!] : []"
          language="json"
        />
      </div>
    </div>

    <!-- Middle Command Rail & Resizable Splitter -->
    <div
      class="workspace__divider"
      [class.workspace__divider--active]="isDragging()"
      aria-label="Editor command rail"
    >
      <!-- Hidden File Input for Open -->
      <input
        #fileInput
        type="file"
        accept=".json,application/json"
        class="sr-only"
        (change)="onFileSelected($event)"
        aria-label="Upload JSON file"
      />

      <!-- Open File Button -->
      <button
        type="button"
        class="rail-btn focus-ring"
        (click)="onTriggerFileInput()"
        title="Open .json file"
        aria-label="Open .json file"
      >
        <lucide-icon [img]="folderOpenIcon" size="14" />
      </button>

      <!-- Load Sample Button -->
      <button
        type="button"
        class="rail-btn focus-ring"
        (click)="onLoadSample()"
        title="Load Sample JSON"
        aria-label="Load Sample JSON"
      >
        <lucide-icon [img]="sparklesIcon" size="14" />
      </button>

      <div class="rail-divider"></div>

      <!-- Export Dropdown -->
      <div class="dropdown-wrapper rail-dropdown" appClickOutside (clickOutside)="isExportMenuOpen.set(false)">
        <button
          type="button"
          class="rail-btn focus-ring"
          (click)="toggleExportMenu()"
          [attr.aria-expanded]="isExportMenuOpen()"
          aria-haspopup="true"
          title="Export JSON"
          aria-label="Export JSON"
        >
          <lucide-icon [img]="exportIcon" size="14" />
        </button>

        @if (isExportMenuOpen()) {
          <div class="dropdown-menu rail-menu animate-scale-in" role="menu">
            <button type="button" class="dropdown-item" (click)="onExport('json')" role="menuitem">
              <span>Download .json</span>
            </button>
            <button type="button" class="dropdown-item" (click)="onExport('pdf')" role="menuitem">
              <span>Download .pdf (Report)</span>
            </button>
            <button type="button" class="dropdown-item" (click)="onExport('csv')" role="menuitem">
              <span>Download .csv</span>
            </button>
          </div>
        }
      </div>

      <!-- Share Dropdown & Card -->
      <div class="dropdown-wrapper rail-dropdown" appClickOutside (clickOutside)="closeShareMenu()">
        <button
          type="button"
          class="rail-btn focus-ring"
          [class.rail-btn--active]="isShareMenuOpen()"
          (click)="onToggleShare()"
          [attr.aria-expanded]="isShareMenuOpen()"
          aria-haspopup="dialog"
          title="Share JSON Workspace"
          aria-label="Share workspace via shortened URL"
        >
          <lucide-icon [img]="shareIcon" size="14" />
        </button>

        <app-share-dialog
          [(isOpen)]="isShareMenuOpen"
          [splitPercent]="splitPercent()"
          [shareData]="shareData()"
          [isShareCopied]="isShareCopied()"
          [(isQrPreviewOpen)]="isQrPreviewOpen"
          [qrCodeDataUrl]="qrCodeDataUrl()"
          (copyRequested)="copyShareUrl()"
          (viewQrRequested)="onViewQr()"
          (downloadQrRequested)="downloadQrImage()"
          (closeRequested)="closeShareMenu()"
          (closeQrPreviewRequested)="closeQrPreview()"
        />
      </div>

      <div class="rail-divider"></div>

      <!-- Clear Button -->
      <button
        type="button"
        class="rail-btn rail-btn--danger focus-ring"
        (click)="onClear()"
        title="Clear Editor"
        aria-label="Clear all content"
      >
        <lucide-icon [img]="trashIcon" size="14" />
      </button>

      <!-- Center Spacer / Resize Grip -->
      <div class="rail-spacer"></div>

      <div
        class="rail-grip"
        appResizableSplitter
        [container]="containerRef()?.nativeElement!"
        direction="horizontal"
        [minPrimaryPx]="340"
        [minSecondaryPx]="360"
        [(splitPercent)]="splitPercent"
        [(isDragging)]="isDragging"
        (resetRequested)="resetSplit()"
        (splitChange)="onSplitChange($event)"
        title="Drag to resize panels (double-click to center 50/50)"
        aria-label="Resize panels splitter"
      >
        <span class="rail-grip-line"></span>
      </div>

      <div class="rail-spacer"></div>

      <div class="rail-divider rail-divider--split"></div>

      <!-- Center Split Reset Button -->
      <button
        type="button"
        class="rail-btn rail-btn--center-split focus-ring"
        [class.rail-btn--active]="!isSplitCentered()"
        (click)="resetSplit()"
        [title]="isSplitCentered() ? 'Split is Centered (50/50)' : 'Reset Split to Center (50/50) — Currently ' + splitPercent() + '/' + (100 - splitPercent())"
        aria-label="Reset split to center (50/50)"
      >
        <lucide-icon [img]="centerSplitIcon" size="14" />
      </button>

      <!-- Mobile Toggle Button (Mobile only: positioned directly above Fullscreen button) -->
      <button
        type="button"
        class="rail-btn rail-btn--mobile-toggle focus-ring"
        (click)="toggleMobilePane()"
        [title]="mobilePane() === 'input' ? 'Open Output Lens (Tree, Code, Types)' : 'Back to Input JSON Editor'"
        [attr.aria-label]="mobilePane() === 'input' ? 'Open Output Lens' : 'Back to Input JSON Editor'"
      >
        <lucide-icon [img]="mobilePane() === 'input' ? chevronRightIcon : chevronLeftIcon" size="14" />
      </button>

      <!-- Mobile divider for proper separation and gap before fullscreen button -->
      <div class="rail-divider rail-divider--mobile-sep"></div>

      <!-- Fullscreen Toggle Button -->
      <button
        type="button"
        class="rail-btn focus-ring"
        (click)="toggleFullscreen()"
        [title]="isFullscreen() ? 'Exit Fullscreen (Esc)' : 'Fullscreen Editor'"
        [aria-label]="isFullscreen() ? 'Exit Fullscreen' : 'Fullscreen Editor'"
      >
        <lucide-icon [img]="isFullscreen() ? minimizeFullscreenIcon : maximizeIcon" size="14" />
      </button>
    </div>

    <!-- Right Pane: Lens Output Views -->
    <div
      class="workspace__pane workspace__pane--output"
      [style.flex-basis.%]="100 - splitPercent()"
      (pointerdown)="setActivePane('output')"
      (focusin)="setActivePane('output')"
    >
      <!-- Lens Tabs Bar -->
      <nav class="lens-nav" role="tablist" aria-label="Select view lens">
        <button
          type="button"
          class="lens-tab"
          role="tab"
          [attr.aria-selected]="activeLens() === 'code'"
          [class.lens-tab--active]="activeLens() === 'code'"
          (click)="setLens('code')"
          aria-label="Formatted Code View"
        >
          <lucide-icon [img]="codeIcon" size="14" />
          <span>Code</span>
        </button>

        <button
          type="button"
          class="lens-tab"
          role="tab"
          [attr.aria-selected]="activeLens() === 'tree'"
          [class.lens-tab--active]="activeLens() === 'tree'"
          (click)="setLens('tree')"
          aria-label="Interactive Tree View"
        >
          <lucide-icon [img]="treeIcon" size="14" />
          <span>Tree</span>
        </button>

        <button
          type="button"
          class="lens-tab"
          role="tab"
          [attr.aria-selected]="activeLens() === 'type'"
          [class.lens-tab--active]="activeLens() === 'type'"
          (click)="setLens('type')"
          aria-label="Type Generator View"
        >
          <lucide-icon [img]="typeIcon" size="14" />
          <span>Types</span>
        </button>

        <button
          type="button"
          class="lens-tab"
          role="tab"
          [attr.aria-selected]="activeLens() === 'diff'"
          [class.lens-tab--active]="activeLens() === 'diff'"
          (click)="setLens('diff')"
          aria-label="Diff Comparison View"
        >
          <lucide-icon [img]="diffIcon" size="14" />
          <span>Diff</span>
        </button>
      </nav>

      <!-- Active Lens View -->
      <div class="pane-content">
        @switch (activeLens()) {
          @case ('code') {
            <app-code-lens #codeLens />
          }
          @case ('tree') {
            <app-tree-lens #treeLens />
          }
          @case ('type') {
            <app-type-lens #typeLens />
          }
          @case ('diff') {
            <app-diff-lens />
          }
        }
      </div>
    </div>
  </div>

  <!-- Bottom Diagnostics & Stats Bar -->
  <app-status-bar [activeLens]="activeLens()" [mobilePane]="mobilePane()" />

  <!-- Full-Screen Lightbox for Workspace QR Code (Root level for proper z-index stacking over header) -->
  @defer (when isQrPreviewOpen(); prefetch on idle) {
    <app-image-previewer
      [isOpen]="isQrPreviewOpen()"
      [src]="qrCodeDataUrl()"
      title="Workspace QR Code"
      subtitle="Scan with mobile camera or download high-res PNG"
      alt="Workspace QR Code Preview"
      filename="jsonlens-workspace-qr.png"
      (closed)="closeQrPreview()"
      (download)="downloadQrImage()"
    />
  }
</section>
