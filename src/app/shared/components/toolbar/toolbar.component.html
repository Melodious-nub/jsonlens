<div class="toolbar" role="toolbar" aria-label="JSON Editing and Formatting Toolbar">
  <!-- Left Group: Core Actions -->
  <div class="toolbar__group">
    <button
      type="button"
      class="btn btn--primary focus-ring"
      (click)="onFormat()"
      aria-label="Format JSON"
      title="Format JSON (Prettify)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <line x1="21" y1="10" x2="3" y2="10" />
        <line x1="21" y1="6" x2="3" y2="6" />
        <line x1="21" y1="14" x2="3" y2="14" />
        <line x1="21" y1="18" x2="3" y2="18" />
      </svg>
      <span>Format</span>
    </button>

    <button
      type="button"
      class="btn btn--default focus-ring"
      (click)="onMinify()"
      aria-label="Minify JSON"
      title="Minify JSON (Compact single-line)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <polyline points="4 14 10 14 10 20" />
        <polyline points="20 10 14 10 14 4" />
        <line x1="14" y1="10" x2="21" y2="3" />
        <line x1="3" y1="21" x2="10" y2="14" />
      </svg>
      <span>Minify</span>
    </button>

    <button
      type="button"
      class="btn focus-ring"
      [class.btn--repair-active]="!engine.isValid()"
      [class.btn--default]="engine.isValid()"
      (click)="onAutoRepair()"
      aria-label="Auto-Fix JSON Syntax Errors"
      title="One-Click Auto-Repair Syntax"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="M5 3v4" />
        <path d="M19 17v4" />
        <path d="M3 5h4" />
        <path d="M17 19h4" />
      </svg>
      <span>Auto-Fix</span>
    </button>
  </div>

  <div class="toolbar__divider" role="separator" aria-orientation="vertical"></div>

  <!-- Middle Group: Indent & Sort & Utilities -->
  <div class="toolbar__group">
    <!-- Indent Dropdown -->
    <div class="dropdown-wrapper" appClickOutside (clickOutside)="isIndentMenuOpen.set(false)">
      <button
        type="button"
        class="btn btn--subtle focus-ring"
        (click)="toggleIndentMenu()"
        [attr.aria-expanded]="isIndentMenuOpen()"
        aria-haspopup="true"
        aria-label="Select indentation spacing"
      >
        <span class="dropdown-label">Indent: {{ engine.indentOption() }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-chevron">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (isIndentMenuOpen()) {
        <div class="dropdown-menu animate-scale-in" role="menu">
          <button type="button" class="dropdown-item" (click)="onSetIndent('2-spaces')" role="menuitem">
            <span>2 Spaces</span>
            @if (engine.indentOption() === '2-spaces') { <span class="check-mark">✓</span> }
          </button>
          <button type="button" class="dropdown-item" (click)="onSetIndent('4-spaces')" role="menuitem">
            <span>4 Spaces</span>
            @if (engine.indentOption() === '4-spaces') { <span class="check-mark">✓</span> }
          </button>
          <button type="button" class="dropdown-item" (click)="onSetIndent('tabs')" role="menuitem">
            <span>Tabs</span>
            @if (engine.indentOption() === 'tabs') { <span class="check-mark">✓</span> }
          </button>
          <button type="button" class="dropdown-item" (click)="onSetIndent('minified')" role="menuitem">
            <span>Minified</span>
            @if (engine.indentOption() === 'minified') { <span class="check-mark">✓</span> }
          </button>
        </div>
      }
    </div>

    <!-- Sort Keys -->
    <button
      type="button"
      class="btn btn--subtle focus-ring"
      (click)="onSortKeys(engine.sortOrder() === 'asc' ? 'desc' : 'asc')"
      aria-label="Sort JSON keys alphabetically"
      title="Sort Keys"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <path d="m3 16 4 4 4-4" />
        <path d="M7 20V4" />
        <path d="m21 8-4-4-4 4" />
        <path d="M17 4v16" />
      </svg>
      <span>Sort {{ engine.sortOrder() === 'asc' ? 'Z-A' : 'A-Z' }}</span>
    </button>

    <!-- Data Utilities Dropdown -->
    <div class="dropdown-wrapper" appClickOutside (clickOutside)="isToolsMenuOpen.set(false)">
      <button
        type="button"
        class="btn btn--subtle focus-ring"
        (click)="toggleToolsMenu()"
        [attr.aria-expanded]="isToolsMenuOpen()"
        aria-haspopup="true"
        aria-label="Data utility actions"
      >
        <span>Transform</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-chevron">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (isToolsMenuOpen()) {
        <div class="dropdown-menu animate-scale-in" role="menu">
          <button type="button" class="dropdown-item" (click)="onFlatten()" role="menuitem">
            <span>Flatten Object</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onUnflatten()" role="menuitem">
            <span>Unflatten Object</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onStripNulls()" role="menuitem">
            <span>Strip Null Values</span>
          </button>
        </div>
      }
    </div>
  </div>

  <div class="toolbar__spacer"></div>

  <!-- Right Group: File, Export, Share -->
  <div class="toolbar__group">
    <!-- File Upload -->
    <input
      #fileInput
      type="file"
      accept=".json,application/json"
      class="sr-only"
      (change)="onFileSelected($event)"
      aria-label="Upload JSON file"
    />
    <button
      type="button"
      class="btn btn--subtle focus-ring"
      (click)="onTriggerFileInput()"
      aria-label="Import JSON file"
      title="Open .json file"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <span>Open</span>
    </button>

    <!-- Export Dropdown -->
    <div class="dropdown-wrapper" appClickOutside (clickOutside)="isExportMenuOpen.set(false)">
      <button
        type="button"
        class="btn btn--subtle focus-ring"
        (click)="toggleExportMenu()"
        [attr.aria-expanded]="isExportMenuOpen()"
        aria-haspopup="true"
        aria-label="Export JSON in different formats"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span>Export</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-chevron">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (isExportMenuOpen()) {
        <div class="dropdown-menu dropdown-menu--right animate-scale-in" role="menu">
          <button type="button" class="dropdown-item" (click)="onExport('json')" role="menuitem">
            <span>Download .json</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onExport('pdf')" role="menuitem">
            <span>Download .pdf (Report)</span>
          </button>
          <button type="button" class="dropdown-item" (click)="onExport('csv')" role="menuitem">
            <span>Download .csv</span>
          </button>
        </div>
      }
    </div>

    <!-- Share -->
    <button
      type="button"
      class="btn btn--subtle focus-ring"
      (click)="onShare()"
      aria-label="Copy shareable link"
      title="Compress into URL & Copy Link"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
      </svg>
      <span>Share</span>
    </button>

    <!-- Sample & Clear -->
    <button
      type="button"
      class="btn btn--subtle focus-ring"
      (click)="onLoadSample()"
      aria-label="Load sample JSON"
      title="Load Example JSON"
    >
      <span>Sample</span>
    </button>

    <button
      type="button"
      class="btn btn--subtle focus-ring"
      (click)="onClear()"
      aria-label="Clear all content"
      title="Clear Editor"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <path d="M3 6h18" />
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
      </svg>
    </button>
  </div>
</div>
